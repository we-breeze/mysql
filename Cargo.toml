[package]
name = "brz-mysql"
version = "0.1.0"
edition = "2024"
description = "Breeze platform MySQL access capability: owns the raw sqlx driver and MySQL connection/pool lifecycle."

[dependencies]
async-stream = "0.3"
brz-mysql-derive = { path = "derive" }
chrono = "0.4"
futures-core = "0.3"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "mysql", "chrono", "json", "bigdecimal"] }
thiserror = "2"
tokio = { version = "1", features = ["macros"] }

[features]
integration-tests = []
