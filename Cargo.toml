[package]
name = "brz-mysql"
version = "0.1.0"
edition = "2024"
description = "Breeze platform MySQL access capability: owns the raw sqlx driver and MySQL connection/pool lifecycle."

[dependencies]
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "mysql", "chrono"] }
thiserror = "2"
tokio = { version = "1", features = ["macros"] }

[features]
integration-tests = []
