[package]
name = "brz-mysql"
version = "0.0.8"
edition = "2024"
description = "Breeze platform MySQL access capability: owns the raw sqlx driver and MySQL connection/pool lifecycle."
license = "MIT OR Apache-2.0"
repository = "https://github.com/we-breeze/mysql"

[dependencies]
async-stream = "0.3"
brz-metrics = { package = "brz-metrics", version = "0.0.3" }
brz-mysql-derive = { path = "derive", version = "=0.0.8" }
bytes = "1.9"
chrono = "0.4"
futures-core = "0.3"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "mysql", "chrono", "json", "bigdecimal"] }
thiserror = "2"
tokio = { version = "1", features = ["macros"] }

[features]
integration-tests = []

[lib]
name = "brz_mysql"

[workspace]
members = ["derive", "tools/mysql-bench"]
resolver = "3"
